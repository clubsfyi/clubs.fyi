<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content="initial-scale=1,width=device-width" name="viewport">
		<title>clubs.fyi</title>
		<style type="text/css">
			:root { --ink:#2a4099; --paper:#fbf8f1; }

			* { box-sizing:border-box; margin:0; padding:0; }
			body { background:var(--paper); color:var(--ink); font-family:Helvetica,Arial,sans-serif; font-size:14px; line-height:1.8; }
			a { color:inherit; }
			.page { margin:0 auto; max-width:1100px; padding:24px 32px 64px 32px; }
			.brand { font-size:28px; font-weight:700; }
			.nav { display:flex; flex-wrap:wrap; gap:8px 28px; font-size:14px; }
			.nav.bold { font-weight:700; }
			.rule { border:none; border-top:1px solid var(--ink); margin:12px 0 24px 0; }
			.layout { display:flex; gap:48px; }
			.rail { font-size:13px; white-space:nowrap; writing-mode:vertical-rl; }
			.main { flex:1; min-width:0; }
			.label { font-size:14px; margin:0 0 8px 0; }
			.title { font-size:20px; font-weight:700; margin:0 0 12px 0; }
			.body { margin:0 0 8px 0; max-width:640px; }
			.club { border-top:1px solid var(--ink); display:flex; flex-wrap:wrap; gap:4px 24px; padding:10px 0; }
			.club .name { font-weight:700; text-decoration:none; }
			.club .tags { margin-left:auto; }
			.foot { margin-top:48px; }

			@media (max-width:640px) { .rail { display:none; } .page { padding:16px 20px 48px 20px; } }
		</style>
		<script src="/index.js" type="module"></script>
	</head>
	<body>
		<div class="page">
			<div class="brand">clubs.fyi</div>
			<div class="nav"><span>Cities</span><span>About</span><span>inbox@clubs.fyi</span></div>
			<hr class="rule">
			<div class="nav bold"><span>All Clubs</span><span>New York</span><span>Toronto</span><span>Search</span></div>
			<hr class="rule">
			<div class="layout">
				<div class="rail">clubs.fyi / new communities / re-weaving the social fabric</div>
				<div class="main">
					<p class="label">NEW /</p>
					<p class="title">New communities</p>
					<p class="body">Re-weaving the social fabric, one club at a time. A short list of clubs in each city.</p>
					<div id="cities"></div>
					<div class="foot">
						<hr class="rule">
						<div class="nav bold"><span>+ more</span></div>
						<p class="body"><a href="https://moralestapia.com/" target="_blank">moralestapia.com</a></p>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
